<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TrackYourBaby</title>
  <meta name="description" content="TrackYourBaby is a simple baby activity tracker for parents and caregivers.">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="page">
    <nav class="language-switch" aria-label="Language">
      <a class="active" href="/">English</a>
      <a href="/es/">Español</a>
    </nav>
    <section class="hero">
      <p class="eyebrow">Baby activity tracking</p>
      <h1>TrackYourBaby</h1>
      <p class="lead">A simple app for parents and caregivers to record feeding, sleep, diapers, baths, milestones, reminders, and baby care history.</p>
      <div class="store-row" aria-label="App availability">
        <div class="store-badge" aria-label="Coming soon on the App Store">
          <span class="store-icon"></span>
          <span>
            <span class="store-small">Coming soon on the</span>
            <span class="store-name">App Store</span>
          </span>
        </div>
        <div class="store-badge" aria-label="Coming soon on Google Play">
          <span class="play-icon" aria-hidden="true"></span>
          <span>
            <span class="store-small">Coming soon on</span>
            <span class="store-name">Google Play</span>
          </span>
        </div>
      </div>
      <div class="actions">
        <a class="button" href="/privacy-policy/">Privacy Policy</a>
        <a class="button secondary" href="/support/">Support</a>
      </div>
    </section>
  </main>
</body>
</html>
