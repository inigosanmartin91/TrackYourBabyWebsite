<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TrackYourBaby</title>
  <meta name="description" content="TrackYourBaby es una app sencilla para registrar la actividad diaria del bebé.">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="page">
    <nav class="language-switch" aria-label="Idioma">
      <a href="/">English</a>
      <a class="active" href="/es/">Español</a>
    </nav>
    <section class="hero">
      <p class="eyebrow">Registro de actividad del bebé</p>
      <h1>TrackYourBaby</h1>
      <p class="lead">Una app sencilla para padres y cuidadores donde registrar tomas, sueño, pañales, baños, hitos, recordatorios e historial de cuidado del bebé.</p>
      <div class="store-row" aria-label="Disponibilidad de la app">
        <div class="store-badge" aria-label="Próximamente en App Store">
          <span class="store-icon"></span>
          <span>
            <span class="store-small">Próximamente en</span>
            <span class="store-name">App Store</span>
          </span>
        </div>
        <div class="store-badge" aria-label="Próximamente en Google Play">
          <span class="play-icon" aria-hidden="true"></span>
          <span>
            <span class="store-small">Próximamente en</span>
            <span class="store-name">Google Play</span>
          </span>
        </div>
      </div>
      <div class="actions">
        <a class="button" href="/es/privacy-policy/">Política de privacidad</a>
        <a class="button secondary" href="/es/support/">Soporte</a>
      </div>
    </section>
  </main>
</body>
</html>
